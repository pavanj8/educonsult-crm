<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign in — EduConsult CRM</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form id="login-form">
        <label>
          Email
          <input data-testid="login-email" name="email" type="email" autocomplete="username" required />
        </label>
        <label>
          Password
          <input
            data-testid="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <p data-testid="login-error" hidden role="alert"></p>
        <button data-testid="login-submit" type="submit">Sign in</button>
      </form>
    </main>
    <script>
      const form = document.getElementById('login-form')
      const errorEl = document.querySelector('[data-testid="login-error"]')

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        errorEl.hidden = true
        errorEl.textContent = ''

        const formData = new FormData(form)
        const email = formData.get('email')
        const password = formData.get('password')

        try {
          const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          })

          if (!response.ok) {
            const body = await response.json().catch(() => ({}))
            errorEl.textContent = body.detail ?? 'Invalid email or password'
            errorEl.hidden = false
            return
          }

          const tokens = await response.json()
          localStorage.setItem('access_token', tokens.access_token)
          if (tokens.refresh_token) {
            localStorage.setItem('refresh_token', tokens.refresh_token)
          }
          window.location.href = '/'
        } catch {
          errorEl.textContent = 'Unable to sign in'
          errorEl.hidden = false
        }
      })
    </script>
  </body>
</html>
