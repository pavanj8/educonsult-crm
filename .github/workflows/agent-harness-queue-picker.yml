name: Agent Harness Queue Picker

# Paces backlog processing so a large batch of issues can be queued once
# and then trickle through unattended -- no laptop, no chat session, no
# human needing to trigger each one. See docs/adr/0011 and the "even if I
# close my laptop it should work" requirement behind docs/adr/0009.
#
# Why this exists instead of just labeling many issues at once: GitHub's
# `concurrency:` group on agent-harness.yml only holds "1 running + 1
# queued" per group when cancel-in-progress is false -- it is not an
# unbounded FIFO queue. Labeling 96 issues within seconds in practice
# cancelled 94 of them, keeping only the very last one. This workflow
# instead triggers exactly one untouched issue at a time, waits for the
# harness to be fully idle before picking the next, and is paced by its
# own schedule rather than a burst of near-simultaneous label events.
#
# IMPORTANT: this job must explicitly `gh workflow run agent-harness.yml`
# (a workflow_dispatch call) rather than relying on the `agent:ready-for-dev`
# label add alone to fire agent-harness.yml's `issues: types: [labeled]`
# trigger. GitHub does not let events triggered by the default
# GITHUB_TOKEN start other workflow runs -- specifically to prevent
# infinite trigger loops -- with workflow_dispatch/repository_dispatch as
# the only exceptions. The label add here is still useful bookkeeping
# (visible on the issue, and used below to detect "already touched"), but
# by itself it silently does nothing when performed by github-actions[bot].
# This was discovered the hard way: issues #56/#57/#58 each got labeled by
# this workflow across three ticks and none of them actually ran (see
# docs/adr/0012's amendment).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  actions: write
  # contents:read is required for `gh workflow run` to resolve
  # repository.defaultBranchRef. Without it the picker labels the issue
  # then dies on GraphQL "Resource not accessible by integration", leaving
  # a dangling agent:ready-for-dev and no harness run (docs/adr/0012).
  contents: read

jobs:
  pick-next:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_ITERATIONS: "5"
    steps:
      - name: Skip if a harness run is already active or queued
        id: busy
        run: |
          ACTIVE=$(gh run list -R ${{ github.repository }} --workflow=agent-harness.yml --limit 10 --json status \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length')
          echo "Active/queued harness runs: $ACTIVE"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick next MVP task (untouched or needs-rework) and trigger it
        if: steps.busy.outputs.busy == 'false'
        run: |
          # Eligible: never-touched (no agent:* label) OR agent:needs-rework
          # with iteration < MAX_ITERATIONS. Prefer needs-rework so Test/
          # Review feedback is addressed before starting a new ticket
          # (docs/adr/0015). Untouched issues still drain when nothing is
          # waiting on retry.
          NEXT=$(gh issue list -R ${{ github.repository }} --label "task,phase:mvp" --state open --limit 300 --json number,labels \
            | jq -r --argjson max "$MAX_ITERATIONS" '
              def names: [.labels[].name];
              def iter: [names[] | select(startswith("agent:iteration-")) | split("-") | last | tonumber] | .[0] // 0;
              def untouched: (names | any(startswith("agent:")) | not);
              def retryable: ((names | index("agent:needs-rework")) != null) and (iter < $max);
              [.[] | select(untouched or retryable)]
              | sort_by([if ((.labels | map(.name) | index("agent:needs-rework")) != null) then 0 else 1 end, .number])
              | .[0].number // empty
            ')
          if [ -n "$NEXT" ]; then
            echo "Triggering harness for issue #$NEXT"
            gh issue edit "$NEXT" -R ${{ github.repository }} --add-label "agent:ready-for-dev"
            gh workflow run agent-harness.yml -R ${{ github.repository }} --ref main -f issue_number="$NEXT"
          else
            echo "No eligible open phase:mvp task issues remain -- nothing to queue."
          fi
