name: Agent Harness Queue Picker

# Paces backlog processing so a large batch of issues can be queued once
# and then trickle through unattended -- no laptop, no chat session, no
# human needing to trigger each one. See docs/adr/0011 and the "even if I
# close my laptop it should work" requirement behind docs/adr/0009.
#
# Why this exists instead of just labeling many issues at once: GitHub's
# `concurrency:` group on agent-harness.yml (the Dev stage) only holds
# "1 running + 1 queued" per group. Test and Review are separate workflows
# (docs/adr/0016) and do not take this slot, so they can run while Dev
# works a different ticket. This picker only starts a new Dev when the
# Dev workflow is idle.
#
# IMPORTANT: this job must explicitly `gh workflow run agent-harness.yml`
# (a workflow_dispatch call) rather than relying on the `agent:ready-for-dev`
# label add alone to fire agent-harness.yml's `issues: types: [labeled]`
# trigger. GitHub does not let events triggered by the default
# GITHUB_TOKEN start other workflow runs -- specifically to prevent
# infinite trigger loops -- with workflow_dispatch/repository_dispatch as
# the only exceptions. The label add here is still useful bookkeeping
# (visible on the issue, and used below to detect "already touched"), but
# by itself it silently does nothing when performed by github-actions[bot].
# This was discovered the hard way: issues #56/#57/#58 each got labeled by
# this workflow across three ticks and none of them actually ran (see
# docs/adr/0012's amendment).

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  actions: write
  # contents:read is required for `gh workflow run` to resolve
  # repository.defaultBranchRef. Without it the picker labels the issue
  # then dies on GraphQL "Resource not accessible by integration", leaving
  # a dangling agent:ready-for-dev and no harness run (docs/adr/0012).
  contents: read

jobs:
  pick-next:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_ITERATIONS: "5"
    steps:
      - name: Skip if a Dev Agent run is already active or queued
        id: busy
        run: |
          ACTIVE=$(gh run list -R ${{ github.repository }} --workflow=agent-harness.yml --limit 10 --json status,event \
            --jq '[.[] | select(.event != "issue_comment") | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length')
          echo "Active/queued Dev (agent-harness.yml) runs: $ACTIVE"
          echo "Test/Review running on other tickets do not block picking the next Dev (docs/adr/0016)."
          if [ "$ACTIVE" -gt 0 ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      # Ordering lives in agents/queue_picker.py — the SAME module the local
      # runner uses (docs/adr/0024, 0031) — so cloud and laptop can't disagree.
      - name: Checkout (for queue_picker.py)
        if: steps.busy.outputs.busy == 'false'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.busy.outputs.busy == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick next MVP task (untouched or needs-rework) and trigger it
        if: steps.busy.outputs.busy == 'false'
        run: |
          # Eligible + ordering (topological, to minimize dependency-driven
          # failures): needs-rework first, then epic order, then
          # Backend->Frontend->Tests, then number. See queue_picker.py.
          NEXT=$(python agents/queue_picker.py "${{ github.repository }}")
          if [ -n "$NEXT" ]; then
            echo "Triggering harness for issue #$NEXT"
            gh issue edit "$NEXT" -R ${{ github.repository }} --add-label "agent:ready-for-dev"
            gh workflow run agent-harness.yml -R ${{ github.repository }} --ref main -f issue_number="$NEXT"
          else
            echo "No eligible open task issues remain for the configured phase (queue.phase) -- nothing to queue."
          fi
