name: Agent Harness Finalize

# Join point after Test and Review have both recorded labels for the same
# iteration. First caller that finds all three of gate/test/review present
# finalizes; earlier callers no-op as `waiting`. See docs/adr/0016.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number"
        required: true
      iteration:
        description: "Harness iteration to join"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: agent-finalize-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_ITERATIONS: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Try finalize
        id: finalize
        working-directory: agents
        run: |
          python try_finalize.py ${{ github.event.inputs.issue_number }} ${{ github.event.inputs.iteration }} | tee finalize_output.txt
          if grep -q "Final status: ready-to-merge" finalize_output.txt; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
          elif grep -q "Final status: needs-rework" finalize_output.txt; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge PR once CI is green (docs/adr/0011, docs/adr/0020)
        if: steps.finalize.outputs.ready == 'true'
        run: |
          BRANCH="agent/issue-${{ github.event.inputs.issue_number }}"
          ISSUE="${{ github.event.inputs.issue_number }}"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $BRANCH; skipping auto-merge."
            exit 0
          fi

          # This repo is on a plan without branch protection, so GitHub cannot
          # enforce required status checks -- `gh pr merge` would merge even
          # with red CI (this is how main once went lint-dirty). The harness
          # therefore enforces CI itself: wait for checks, merge only if green.
          # `gh pr checks --watch` blocks until all checks finish, exits 0 iff
          # all passed, non-zero on failure OR when there are no checks at all.
          if timeout 1200 gh pr checks "$PR_NUMBER" --watch --fail-fast --interval 30; then
            CI_OK=true
          else
            # Distinguish "a check failed" from "no checks exist" (infra-only
            # PRs touch no backend/frontend paths, so CI never triggers).
            NCHECKS=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '.statusCheckRollup | length')
            if [ "$NCHECKS" = "0" ]; then CI_OK=true; else CI_OK=false; fi
          fi

          if [ "$CI_OK" = "true" ]; then
            if gh pr merge "$PR_NUMBER" --merge --delete-branch; then
              # Closes #N in the PR body is unreliable; close explicitly. No
              # comment -- an issue_comment would start agent-harness.yml, which
              # then skips and looks "busy" to the picker.
              gh issue close "$ISSUE" -R ${{ github.repository }} || true
            else
              echo "::warning::CI green but merge failed (likely not mergeable vs main); flagging for rework."
              gh issue edit "$ISSUE" -R ${{ github.repository }} --remove-label "agent:ready-to-merge" --add-label "agent:needs-rework" || true
            fi
          else
            echo "::warning::Agent gates passed but CI is red; NOT merging. Handing back to the rework loop."
            gh issue edit "$ISSUE" -R ${{ github.repository }} --remove-label "agent:ready-to-merge" --add-label "agent:needs-rework" || true
            gh issue comment "$ISSUE" -R ${{ github.repository }} --body "## Harness iteration — CI gate blocked merge. Agent gates (test/review/hard-gate) passed but a merge-blocking CI check is red, so auto-merge was withheld. See the PR checks; the CI Feedback Loop has the failing logs. Fix and the harness will retry (docs/adr/0020)."
          fi

      - name: Start next Dev (do not wait for cron)
        if: steps.finalize.outputs.ready == 'true'
        run: |
          gh workflow run agent-harness-queue-picker.yml -R ${{ github.repository }} --ref main

      - name: Auto-retry on needs-rework (docs/adr/0015)
        if: steps.finalize.outputs.retry == 'true'
        run: |
          N="${{ github.event.inputs.iteration }}"
          ISSUE="${{ github.event.inputs.issue_number }}"
          if [ "$N" -lt "$MAX_ITERATIONS" ]; then
            NEXT=$((N + 1))
            echo "Iteration $N failed; dispatching Dev retry $NEXT/$MAX_ITERATIONS for #$ISSUE"
            gh issue comment "$ISSUE" --body "Auto-retrying: Dev Agent will receive Test/Review/gate feedback from iteration ${N} on iteration ${NEXT} (cap ${MAX_ITERATIONS}). See docs/adr/0015."
            gh workflow run agent-harness.yml -R ${{ github.repository }} --ref main -f issue_number="$ISSUE"
          else
            echo "Hit MAX_ITERATIONS=$MAX_ITERATIONS on #$ISSUE; leaving agent:needs-rework."
            gh issue comment "$ISSUE" --body "Stopped auto-retry after ${MAX_ITERATIONS} iterations. Label remains \`agent:needs-rework\`. Comment \`/dev-agent\` (or run the workflow manually) to continue. See docs/adr/0015."
          fi
