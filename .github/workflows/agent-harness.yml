name: Agent Harness (Dev)

# Dev stage only. After this job pushes the issue branch it dispatches
# Test and Review in parallel (separate workflows) so those agents are
# not sitting idle while Dev works a different ticket. See docs/adr/0016.
#
# Runs entirely on GitHub-hosted runners -- no dependency on any personal
# machine being on. Triggered by adding the `agent:ready-for-dev` label to
# an issue, commenting `/dev-agent` on an issue, or manually via
# workflow_dispatch.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to work"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Serializes Dev Agents repo-wide (docs/adr/0016). Test/Review run in
  # other workflows and are not in this group, so they can overlap Dev
  # work on a different ticket. Keep the historic group name so any
  # in-flight pre-split harness run still serializes with new Dev jobs.
  group: agent-harness-queue
  cancel-in-progress: false

jobs:
  run-harness:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent:ready-for-dev') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '/dev-agent')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # CURSOR_API_KEY kept provisioned but dormant -- the harness engine is
      # now MiniMax (docs/adr/0019); no agent consumes this key.
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_BASE_URL: https://api.minimax.io/v1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Asymmetric model tiering (docs/adr/0013): cheap MiniMax model to
      # write, stronger MiniMax model to verify (docs/adr/0019).
      DEV_AGENT_MODEL: MiniMax-M2.5-highspeed

    steps:
      - name: Determine issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push files under .github/workflows/
          # ("without workflows permission"). A PAT/fine-grained token
          # with the `workflow` scope, stored as GH_PAT, can. Falls back
          # to GITHUB_TOKEN for tickets that do not touch workflow files.
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        working-directory: agents
        run: pip install -r requirements.txt

      - name: Create or resume working branch
        id: branch
        run: |
          BRANCH="agent/issue-${{ steps.issue.outputs.number }}"
          git fetch origin
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH" origin/main
          fi
          git config user.name "agent-harness-bot"
          git config user.email "agent-harness-bot@users.noreply.github.com"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Prepare iteration
        id: iteration
        working-directory: agents
        run: |
          N=$(python prepare_iteration.py ${{ steps.issue.outputs.number }})
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - name: Dev Agent
        id: dev
        working-directory: agents
        continue-on-error: true
        run: python dev_agent.py ${{ steps.issue.outputs.number }} --iteration ${{ steps.iteration.outputs.number }} --model "$DEV_AGENT_MODEL"

      - name: Commit Dev Agent changes
        id: commit
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Dev Agent: issue #${{ steps.issue.outputs.number }} iteration ${{ steps.iteration.outputs.number }}"
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Mark needs-rework if commit/push failed
        if: failure() && steps.commit.conclusion == 'failure'
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"
          gh issue edit "$ISSUE" -R ${{ github.repository }} --add-label "agent:needs-rework"
          gh issue comment "$ISSUE" -R ${{ github.repository }} --body "Dev Agent commit/push failed, so Test/Review were not started. Labelled \`agent:needs-rework\` so the picker/retry can pick this up. See the Actions log for the push error."

      - name: Hard test gate
        id: gate
        working-directory: agents
        continue-on-error: true
        run: python check_test_gate.py --base origin/main

      - name: Record gate result
        if: steps.gate.conclusion == 'success' || steps.gate.conclusion == 'failure'
        working-directory: agents
        env:
          ISSUE: ${{ steps.issue.outputs.number }}
          GATE_OK: ${{ steps.gate.outcome }}
        run: python -c "import os, github_ticket_utils as t; t.set_result_label(int(os.environ['ISSUE']), 'gate', os.environ['GATE_OK']=='success')"

      - name: Open or update pull request
        run: |
          if ! gh pr list --head "${{ steps.branch.outputs.name }}" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --title "Issue #${{ steps.issue.outputs.number }}: agent harness implementation" \
              --body "Automated implementation by the Dev/Test/Review agent harness. Closes #${{ steps.issue.outputs.number }}." \
              --head "${{ steps.branch.outputs.name }}" \
              --base main
          fi

      - name: Dispatch Test and Review for THIS issue only (docs/adr/0016)
        working-directory: agents
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"
          ITER="${{ steps.iteration.outputs.number }}"
          python require_dev_completed.py "$ISSUE" "$ITER"
          echo "Dispatching Test + Review for #$ISSUE iteration $ITER (same ticket Dev just finished)"
          gh workflow run agent-test.yml -R ${{ github.repository }} --ref main \
            -f issue_number="$ISSUE" -f iteration="$ITER"
          gh workflow run agent-review.yml -R ${{ github.repository }} --ref main \
            -f issue_number="$ISSUE" -f iteration="$ITER"
