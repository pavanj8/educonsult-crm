name: Agent Harness (Dev)

# Dev stage only. After this job pushes the issue branch it dispatches
# Test and Review in parallel (separate workflows) so those agents are
# not sitting idle while Dev works a different ticket. See docs/adr/0016.
#
# Runs entirely on GitHub-hosted runners -- no dependency on any personal
# machine being on. Triggered by adding the `agent:ready-for-dev` label to
# an issue, commenting `/dev-agent` on an issue, or manually via
# workflow_dispatch.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to work"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Serializes Dev Agents repo-wide (docs/adr/0016). Test/Review run in
  # other workflows and are not in this group, so they can overlap Dev
  # work on a different ticket. Keep the historic group name so any
  # in-flight pre-split harness run still serializes with new Dev jobs.
  group: agent-harness-queue
  cancel-in-progress: false

jobs:
  run-harness:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent:ready-for-dev') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '/dev-agent')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Provider-agnostic (docs/adr/0031): base_url + model come from
      # harness.config.json > llm. Pass every provider key the config might
      # select; unset secrets resolve to empty and are simply unused.
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Determine issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push files under .github/workflows/
          # ("without workflows permission"). A PAT/fine-grained token
          # with the `workflow` scope, stored as GH_PAT, can. Falls back
          # to GITHUB_TOKEN for tickets that do not touch workflow files.
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        working-directory: agents
        run: pip install -r requirements.txt

      - name: Create or resume working branch
        id: branch
        run: |
          BRANCH="agent/issue-${{ steps.issue.outputs.number }}"
          git fetch origin
          git config user.name "agent-harness-bot"
          git config user.email "agent-harness-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            # Bring a resumed branch up to date with main so it inherits merged
            # fixes (e.g. lint cleanups) instead of running stale copies of
            # shared files like backend/tests (docs/adr/0019 follow-up).
            # Protected paths (tooling/docs/CI) are authoritative on main and
            # legitimately diverge as the harness evolves, so any conflict there
            # is auto-resolved in main's favor; a real conflict in PRODUCT code
            # aborts loudly for manual resolution.
            git merge --no-commit --no-ff origin/main || true
            for p in agents docs .github .cursor scripts; do
              git checkout origin/main -- "$p" 2>/dev/null || true
            done
            git add -A
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Merge conflict outside protected paths in $BRANCH; needs manual resolution."
              git merge --abort
              exit 1
            fi
            # Complete the merge commit (no-op if the branch was already current).
            git commit --no-edit -m "Sync $BRANCH with main" 2>/dev/null || true
          else
            git checkout -B "$BRANCH" origin/main
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Refresh harness tooling from main (protected paths)
        # agents/ and the DoD are protected paths, never part of a ticket's
        # diff, so always run the LATEST copies even on a resumed older branch
        # -- otherwise prompt/tooling fixes never reach in-flight branches
        # (docs/adr/0019 follow-up).
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- agents/ scripts/ docs/definition-of-done.md

      - name: Prepare iteration
        id: iteration
        working-directory: agents
        run: |
          N=$(python prepare_iteration.py ${{ steps.issue.outputs.number }})
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - name: Dev Agent
        id: dev
        working-directory: agents
        continue-on-error: true
        # Hard wall-clock cap (docs/adr/0029): DEV_MAX_TURNS bounds the turn
        # COUNT, but a turn that re-runs the full test suite takes minutes, so a
        # churning run (e.g. #175 at ~41 min) can still hog the single Dev slot.
        # On timeout the step fails -> build gate -> needs-rework -> retry, which
        # is cheaper than letting it run unbounded. Sized for a normal pass plus
        # one in-run retry.
        timeout-minutes: 30
        run: python dev_agent.py ${{ steps.issue.outputs.number }} --iteration ${{ steps.iteration.outputs.number }}

      - name: Ruff auto-fix backstop (docs/adr/0019 follow-up)
        # Best-effort: auto-fixes import-order (I) and unused imports (F401)
        # the Dev Agent may have left, so lint-only misses don't block the PR.
        # Unfixable errors still surface in the CI Backend "Ruff lint" gate.
        if: always()
        continue-on-error: true
        run: |
          if [ -d backend ]; then
            python -m pip install ruff==0.16.3
            (cd backend && ruff check --fix . || true)
          else
            echo "no backend/ yet -- skipping ruff backstop"
          fi

      - name: Commit Dev Agent changes
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Dev Agent: issue #${{ steps.issue.outputs.number }} iteration ${{ steps.iteration.outputs.number }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Mark needs-rework if commit/push failed
        if: failure() && steps.commit.conclusion == 'failure'
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"
          gh issue edit "$ISSUE" -R ${{ github.repository }} --add-label "agent:needs-rework"
          gh issue comment "$ISSUE" -R ${{ github.repository }} --body "Dev Agent commit/push failed, so Test/Review were not started. Labelled \`agent:needs-rework\` so the picker/retry can pick this up. See the Actions log for the push error."

      - name: Hard test gate
        id: gate
        working-directory: agents
        continue-on-error: true
        run: python check_test_gate.py --base origin/main

      - name: Record gate result
        if: steps.gate.conclusion == 'success' || steps.gate.conclusion == 'failure'
        working-directory: agents
        env:
          ISSUE: ${{ steps.issue.outputs.number }}
          GATE_OK: ${{ steps.gate.outcome }}
        run: python -c "import os, github_ticket_utils as t; t.set_result_label(int(os.environ['ISSUE']), 'gate', os.environ['GATE_OK']=='success')"

      - name: Open or update pull request
        env:
          # Author the PR as the real user (GH_PAT), not github-actions[bot], so
          # its CI isn't gated by the public-repo first-time-contributor approval
          # policy (docs/adr/0023, docs/adr/0026). Falls back to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE: ${{ steps.issue.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          create_pr() {
            gh pr create -R "$REPO" \
              --title "Issue #$ISSUE: agent harness implementation" \
              --body "Automated implementation by the Dev/Test/Review agent harness. Closes #$ISSUE." \
              --head "$BRANCH" --base main
          }
          pr_info() { gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,author --jq '.[0] | "\(.number) \(.author.login)"'; }

          INFO=$(pr_info)
          if [ -z "$INFO" ]; then
            # Create; retry a few times for transient GH_PAT/API blips (docs/adr/0026).
            for i in 1 2 3; do create_pr && break || { echo "pr create attempt $i failed; retrying"; sleep 5; }; done
            INFO=$(pr_info)
          fi
          AUTHOR=$(printf '%s' "$INFO" | awk '{print $2}')
          NUM=$(printf '%s' "$INFO" | awk '{print $1}')

          # A bot-authored PR gets its CI held as action_required (approval gate).
          # This happens when GH_PAT didn't apply on the ORIGINAL create (e.g. an
          # earlier attempt in a bad window). Recreate it as the real user.
          case "$AUTHOR" in
            github-actions|app/github-actions|"")
              if [ -n "$NUM" ]; then
                echo "::warning::PR #$NUM is bot-authored; closing and recreating with GH_PAT so CI is not approval-gated."
                gh pr close -R "$REPO" "$NUM" || true
              fi
              for i in 1 2 3; do create_pr && break || sleep 5; done
              AUTHOR=$(pr_info | awk '{print $2}')
              ;;
          esac

          case "$AUTHOR" in
            github-actions|app/github-actions|"")
              echo "::error::PR is still bot-authored / missing -- GH_PAT is not being applied. Refresh the GH_PAT secret (fine-grained PAT with contents + pull-requests write). CI will keep needing manual approval until then."
              exit 1
              ;;
            *) echo "PR for $BRANCH authored by: $AUTHOR" ;;
          esac

      - name: Build gate — don't spend Test/Review/CI on broken Dev output (docs/adr/0023)
        id: buildgate
        if: always()
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"
          # (a) Dev Agent crashed -> nothing worth verifying.
          if [ "${{ steps.dev.outcome }}" != "success" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "reason=the Dev Agent step failed (crashed / model error)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # (b) The BRANCH has no work vs main. NOTE: check the branch, not just
          # this iteration's commit -- a resumed branch already carries valid work
          # from a prior iteration even when this run adds no new commit (fixes the
          # false "no code changes" skip on #140, docs/adr/0023).
          git fetch origin main -q || true
          if git diff --quiet origin/main; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "reason=the branch has no changes vs main" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # (c) code exists but doesn't pass the canonical gate -> Test/Review would just
          # rediscover that; skip them and hand straight back to rework.
          if [ -f backend/requirements.txt ]; then
            python -m pip install -q -r backend/requirements.txt ruff==0.16.3 >/dev/null 2>&1 || true
          fi
          if bash scripts/check.sh backend > /tmp/gate.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "reason=scripts/check.sh (backend) failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Test and Review for THIS issue only (docs/adr/0016)
        if: steps.buildgate.outputs.ok == 'true'
        working-directory: agents
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"
          ITER="${{ steps.iteration.outputs.number }}"
          python require_dev_completed.py "$ISSUE" "$ITER"
          echo "Dispatching Test + Review for #$ISSUE iteration $ITER (same ticket Dev just finished)"
          gh workflow run agent-test.yml -R ${{ github.repository }} --ref main \
            -f issue_number="$ISSUE" -f iteration="$ITER"
          gh workflow run agent-review.yml -R ${{ github.repository }} --ref main \
            -f issue_number="$ISSUE" -f iteration="$ITER"

      - name: Skip verification and hand back to rework (build gate failed, docs/adr/0023)
        if: steps.buildgate.outputs.ok != 'true'
        run: |
          ISSUE="${{ steps.issue.outputs.number }}"
          REASON="${{ steps.buildgate.outputs.reason }}"
          echo "Build gate failed ($REASON) -- NOT spending Test/Review/CI; flagging needs-rework."
          {
            echo "## Harness iteration — build gate failed (Test/Review skipped)"
            echo ""
            echo "The Dev output did not pass the build gate, so the expensive Test/Review"
            echo "agents were not run. Reason: **$REASON**. Fix this first; run"
            echo "\`bash scripts/check.sh\` locally to reproduce."
            if [ -f /tmp/gate.log ]; then echo ""; echo '```'; tail -c 4000 /tmp/gate.log; echo '```'; fi
          } > /tmp/rework.md
          gh issue comment "$ISSUE" -R ${{ github.repository }} --body-file /tmp/rework.md || true
          gh issue edit "$ISSUE" -R ${{ github.repository }} --remove-label "agent:ready-to-merge" 2>/dev/null || true
          gh issue edit "$ISSUE" -R ${{ github.repository }} --add-label "agent:needs-rework"
          # Advance the queue: the picker re-picks needs-rework (within MAX_ITERATIONS).
          gh workflow run agent-harness-queue-picker.yml -R ${{ github.repository }} --ref main || true
