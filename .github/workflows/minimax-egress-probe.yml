name: MiniMax Egress Probe

# One-off diagnostic (docs/adr/0019 follow-up): does this runner actually reach
# api.minimax.io, or is LLM egress pinned to the Cursor gateway? Dispatch
# manually; read the "Probe" step log. Delete once the routing question is
# answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_BASE_URL: https://api.minimax.io/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openai
        run: pip install "openai>=1.30"

      - name: Probe
        working-directory: agents
        run: python egress_probe.py
